task: |
  Try to list workspaces in tfc-demo-au with an expired auth token. How should
  the error be handled?
tags: [error-handling, auth]
accept:
  - '(?:expired)|(?:re-authenticate)|(?:login)|(?:exit\s+3)|(?:token)'
reject: ['retry\s+indefinitely', '\|\s*jq']
turns: 10
