name: E2E Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - brandonc/e2e_tests

jobs:
  e2e:
    name: Test tfctl using HCP Terraform Staging
    runs-on: ["self-hosted", "ubuntu-22.04"]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required for Vault access.
    env:
      TFCTL_HOSTNAME: app.staging.terraform.io
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: "vault - authenticate"
        id: vault-auth
        run: vault-auth
      - name: "vault - fetch"
        id: vault-fetch
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ steps.vault-auth.outputs.addr }}
          caCertificate: ${{ steps.vault-auth.outputs.ca_certificate }}
          token: ${{ steps.vault-auth.outputs.token }}
          secrets: kv/data/github/hashicorp/team-tf-core-cloud tfc-staging | staging-token;

      - name: Set TFCTL_TOKEN Variable from secret
        run: |
          echo "TFCTL_TOKEN=${{ steps.vault-fetch.outputs.staging-token }}" >> $GITHUB_ENV

      - name: Run end-to-end test
        run: |
          make e2e
